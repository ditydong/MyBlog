site_name: 暗影大人的知识库
site_description: 学习、技术与项目记录
site_url: https://ditydong.github.io/MyBlog/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - header.autohide

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.mark

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ditydong/MyBlog.git

site_dir: site
docs_dir: docs

use_directory_urls: true