site_name: dust_dong的个人博客
site_description: 学习、技术与项目记录
site_url: https://ditydong.github.io/MyBlog/

theme:
  name: material
  palette: 

    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  language: zh
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - header.autohide
    - toc.follow
    - toc.integrate

plugins:
  - search
  - awesome-pages

# 把 Obsidian 画布渲染成页面，见 hooks/canvas.py
hooks:
  - hooks/canvas.py

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.mark
  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ditydong/MyBlog.git

# 公式渲染：先用 mathjax.js 设配置，再加载 MathJax 本体（顺序不能反）
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-svg.js

site_dir: site
docs_dir: docs

use_directory_urls: true